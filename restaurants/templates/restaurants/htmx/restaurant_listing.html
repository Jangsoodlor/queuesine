{% load card_image %}
{% load static %}
{% static 'images/restaurant.jpg' as default_image %}
{% for restaurant in restaurants %}
  <div class="col">
    <div class="card me-2">
      {% restaurant_card_image restaurant.image restaurant.name %}
      <div class="card-body">
        <a href="{% url 'restaurants:restaurant_detail' restaurant.pk %}">
          <h5 class="card-title">{{ restaurant.name }}</h5>
        </a>
        <p class="card-text">{{ restaurant.description }}</p>
      </div>
    </div>
  </div>
{% endfor %}
