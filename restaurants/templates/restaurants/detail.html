{% extends 'base_template.html' %}
{% load static %}


{% block hero_banner %}
<div class="position-relative text-white" style="aspect-ratio: 3/1;">
  <img src="{% static 'images/restaurant.jpg' %}" alt="{{ restaurant.name }} Restaurant"
    class="w-100 h-100 object-fit-cover position-absolute top-0 start-0" />
  <div class="w-100 h-100 position-absolute top-0 start-0"
    style="background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.7) 100%);"></div>
  <div class="container position-relative h-100 d-flex flex-column justify-content-end p-md-5">
    <h1 class="display-5 fw-bold mb-1">{{ restaurant.name }}</h1>
    <p class="mb-1"><i class="bi bi-geo-alt-fill"></i> {{ restaurant.address }}</p>
    <p class="mb-0">{{ restaurant.description }}</p>
  </div>
</div>
{% endblock %}

{% block content %}


<div id="menus" hx-get="{% url 'restaurants:menu_listing' restaurant.pk %}" hx-trigger="load" hx-target="#menus">
  <!-- Optional placeholder while HTMX loads the menu -->
  <p>Loading menu...</p>
</div>

{% endblock %}
